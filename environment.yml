name: physreason
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip
  - numpy=1.26
  - pandas=2.1
  - scipy=1.11
  - scikit-learn=1.3
  - matplotlib=3.8
  - seaborn=0.13
  - pytorch=2.1
  - cpuonly
  - jupyter
  - notebook
  - pip:
    - openai>=1.0.0
    - anthropic>=0.21.0
    - google-generativeai>=0.3.0
    - together>=1.0.0
    - transformers>=4.30.0
    - bert-score>=0.3.13
    - spacy>=3.6.0
    - sympy>=1.12
    - statsmodels>=0.14.0
    - pingouin>=0.5.3
    - plotly>=5.15.0
    - tqdm>=4.65.0
    - pyyaml>=6.0
    - python-dotenv>=1.0.0
    - jsonlines>=3.1.0
    - pydantic>=2.0.0
    - pytest>=7.0
    - black>=22.0
